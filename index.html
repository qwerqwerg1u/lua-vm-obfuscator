<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Zk Secure Studio - Enterprise Ultimate</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
<div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 space-y-6">
<div class="flex items-center justify-between border-b border-slate-800 pb-4">
<h1 class="text-2xl font-bold tracking-tight text-indigo-400">⚡ Zk Secure Studio - Enterprise Ultimate</h1>
<span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full font-medium">Full Protection Engine</span>
</div>
<div class="space-y-6">
<div>
<div class="flex items-center justify-between mb-2">
<label class="text-sm font-semibold text-slate-300">원본 스크립트 직접 입력 또는 파일 업로드</label>
<button onclick="clearInput()" class="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-3 py-1 rounded-lg transition font-medium">내용 지우기</button>
</div>
<div class="flex items-center gap-3 mb-3">
<input type="file" id="fileInput" accept=".lua,.txt" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
</div>
<textarea id="scriptInput" rows="10" placeholder="루아 코드를 입력하세요..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm font-mono focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block text-sm font-semibold mb-2 text-slate-300">난독화 및 암호화 방식</label>
<select id="obfType" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500">
<option value="hex" selected>16진수 XOR 난독화 (Hex)</option>
<option value="dec">10진수 XOR 난독화 (Decimal)</option>
</select>
</div>
<div>
<label class="block text-sm font-semibold mb-2 text-slate-300">보안 모듈 및 고급 옵션</label>
<div class="grid grid-cols-2 gap-2">
<label class="flex items-center justify-center gap-2 bg-slate-950 border border-slate-800 h-12 px-3 rounded-xl cursor-pointer hover:border-indigo-500/50 transition">
<input type="checkbox" id="antiHook" checked class="accent-indigo-600">
<span class="text-xs text-slate-300 font-medium">안티훅 차단</span>
</label>
<label class="flex items-center justify-center gap-2 bg-slate-950 border border-slate-800 h-12 px-3 rounded-xl cursor-pointer hover:border-indigo-500/50 transition">
<input type="checkbox" id="antiDebug" checked class="accent-indigo-600">
<span class="text-xs text-slate-300 font-medium">안티디버그</span>
</label>
<label class="flex items-center justify-center gap-2 bg-slate-950 border border-slate-800 h-12 px-3 rounded-xl cursor-pointer hover:border-indigo-500/50 transition">
<input type="checkbox" id="antiTamper" checked class="accent-indigo-600">
<span class="text-xs text-slate-300 font-medium">안티탬퍼링</span>
</label>
<label class="flex items-center justify-center gap-2 bg-slate-950 border border-slate-800 h-12 px-3 rounded-xl cursor-pointer hover:border-indigo-500/50 transition">
<input type="checkbox" id="doubleObf" checked class="accent-indigo-600">
<span class="text-xs text-slate-300 font-medium">더블 난독화</span>
</label>
</div>
</div>
</div>
<button onclick="processScript()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-4 rounded-xl transition shadow-lg shadow-indigo-600/20 text-base">완벽 난독화 적용 및 파일 다운로드</button>
</div>
</div>
<script>
document.getElementById('fileInput').addEventListener('change', function(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(evt) {
document.getElementById('scriptInput').value = evt.target.result;
};
reader.readAsText(file);
});

function clearInput() {
document.getElementById('scriptInput').value = '';
document.getElementById('fileInput').value = '';
}

function rStr(len) {
const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
let res = '';
for (let i = 0; i < len; i++) {
res += chars.charAt(Math.floor(Math.random() * chars.length));
}
return res;
}

function lzwCompress(s) {
let dict = {}, data = (s + "").split(""), out = [], phrase = data[0], code = 256;
for (let i = 1; i < data.length; i++) {
let curr = data[i];
if (dict[phrase + curr] != null) {
phrase += curr;
} else {
out.push(phrase.length > 1 ? dict[phrase] : phrase.charCodeAt(0));
dict[phrase + curr] = code++;
phrase = curr;
}
}
out.push(phrase.length > 1 ? dict[phrase] : phrase.charCodeAt(0));
for (let i = 0; i < out.length; i++) {
out[i] = String.fromCharCode(out[i]);
}
return out.join("");
}

function processScript() {
const rawCode = document.getElementById('scriptInput').value;
if (!rawCode.trim()) {
alert('스크립트 내용이 비어있습니다.');
return;
}

const isHex = document.getElementById('obfType').value === 'hex';
const isAntiHook = document.getElementById('antiHook').checked;
const isAntiDebug = document.getElementById('antiDebug').checked;
const isAntiTamper = document.getElementById('antiTamper').checked;
const isDouble = document.getElementById('doubleObf').checked;

const key = Math.floor(Math.random() * 150) + 20;
const compressed = lzwCompress(rawCode);

let encodedData = '';
if (isHex) {
let parts = [];
for (let i = 0; i < compressed.length; i++) {
let xored = compressed.charCodeAt(i) ^ key;
parts.push('\\x' + xored.toString(16).padStart(2, '0'));
}
encodedData = `return "${parts.join('')}"`;
} else {
let parts = [];
for (let i = 0; i < compressed.length; i++) {
parts.push(compressed.charCodeAt(i) ^ key);
}
encodedData = `return {${parts.join(',')}}`;
}

const v1 = rStr(7);
const v2 = rStr(8);
const v3 = rStr(6);
const v4 = rStr(9);
const v5 = rStr(7);
const v6 = rStr(8);
const v7 = rStr(6);
const v8 = rStr(9);
const v9 = rStr(7);
const v10 = rStr(8);
const v11 = rStr(6);
const v12 = rStr(9);
const v13 = rStr(7);
const v14 = rStr(8);
const v15 = rStr(6);

let antiHookCode = '';
if (isAntiHook) {
antiHookCode = `
local ${v13}=game.HttpGet
if tostring(${v13}):find("function: 0x")==nil and not tostring(${v13}):find("builtin") then
error("보호중인스크립트")
end
`;
}

let antiDebugCode = '';
if (isAntiDebug) {
antiDebugCode = `
if debug and debug.info then
local ${v14}=pcall(function() return debug.info(1, "f") end)
if not ${v14} then error("보호중인스크립트") end
end
`;
}

let antiTamperCode = '';
if (isAntiTamper) {
antiTamperCode = `
if not getfenv or not pcall or not loadstring then
error("보호중인스크립트")
end
`;
}

let decodeLogic = '';
if (isHex) {
decodeLogic = `
local ${v8}=""
for ${v9}=1,#${v7} do
local ${v10}=tonumber(${v7}:sub(${v9},${v9}+3))
if ${v10} then
${v8}=${v8}..string.char(${v10}~=${key})
end
end
`;
} else {
decodeLogic = `
local ${v8}=""
for _,${v9} in ipairs(${v7}) do
${v8}=${v8}..string.char(${v9}~=${key})
end
`;
}

let baseScript = `
local ${v1}="보호중인스크립트"
local function ${v2}()
if not game or not game:GetService then
print("이 스크립트는 Zk에 의해 보호되어져 있습니다.")
return false
end
return true
end
if not ${v2}() then return end
${antiHookCode}
${antiDebugCode}
${antiTamperCode}
local ${v5},${v6}=pcall(function()
local ${v7}=(${encoded})()
${decodeLogic}
local ${v11}=getfenv()[string.char(108,111,97,100,115,116,114,105,110,103)](${v8})
if type(${v11})~="function" then
error(${v1})
end
return ${v11}()
end)
if not ${v5} then
local ${v12}=warn
${v12}(${v1})
return
end
`;

let finalCode = baseScript;

if (isDouble) {
const dKey = Math.floor(Math.random() * 150) + 20;
let dParts = [];
for (let i = 0; i < finalCode.length; i++) {
let xored = finalCode.charCodeAt(i) ^ dKey;
dParts.push('\\x' + xored.toString(16).padStart(2, '0'));
}
const dv1 = rStr(7);
const dv2 = rStr(8);
const dv3 = rStr(6);
const dv4 = rStr(9);
const dv5 = rStr(7);
finalCode = `
local ${dv1}="${dParts.join('')}"
local ${dv2}=""
for ${dv3}=1,#${dv1} do
local ${dv4}=tonumber(${dv1}:sub(${dv3},${dv3}+3))
if ${dv4} then
${dv2}=${dv2}..string.char(${dv4}~=${dKey})
end
end
local ${dv5}=getfenv()[string.char(108,111,97,100,115,116,114,105,110,103)](${dv2})
if type(${dv5})=="function" then
${dv5}()
end
`;
}

const blob = new Blob([finalCode], { type: 'text/plain' });
const link = document.createElement('a');
link.href = URL.createObjectURL(blob);
link.download = 'zk_protected_script.lua';
link.click();
URL.revokeObjectURL(link.href);
}
</script>
</body>
</html>
