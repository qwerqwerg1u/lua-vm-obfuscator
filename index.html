<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Full Lua VM Obfuscator (No Loadstring)</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e293b; padding: 20px; border-radius: 8px; }
        h2 { color: #38bdf8; margin-top: 0; }
        textarea { width: 100%; height: 200px; background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 6px; padding: 10px; box-sizing: border-radius; resize: vertical; }
        .btn-group { margin: 15px 0; display: flex; gap: 10px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0369a1; }
        button.sec { background: #334155; }
        button.sec:hover { background: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Full Lua Custom VM Obfuscator</h2>
        <p>모든 루아 문법 지원 (loadstring 미사용 / Pure Virtual Machine 방식)</p>
        
        <label>Source Code:</label>
        <textarea id="src" placeholder="-- 여기에 복잡한 루아 코드를 입력하세요.&#10;local player = game.Players.LocalPlayer&#10;for i = 1, 5 do&#10;    print('Count:', i)&#10;end"></textarea>
        
        <div class="btn-group">
            <button onclick="processObfuscation()">VM 난독화 실행</button>
            <button class="sec" onclick="copyOutput()">복사하기</button>
            <button class="sec" onclick="downloadLua()">파일 저장</button>
        </div>
        
        <label>Obfuscated VM Output:</label>
        <textarea id="out" readonly></textarea>
    </div>

<script>
function generateObfuscatedVM(sourceCode) {
    // 1. 상형문자/랜덤 유니코드 식별자 생성 함수
    function randVar() {
        const chars = ['O', 'o', '0', 'I', 'l', '_'];
        let res = '_';
        for(let i=0; i<12; i++) {
            res += chars[Math.floor(Math.random() * chars.length)];
        }
        return res;
    }

    const vEnv = randVar();
    const vByte = randVar();
    const vVM = randVar();
    const vDec = randVar();
    const vStk = randVar();
    const vPC = randVar();

    // 2. 입력된 소스 코드를 바이트 바운딩 테이블로 변환 (바이트코드 직렬화)
    let byteTable = [];
    for (let i = 0; i < sourceCode.length; i++) {
        byteTable.push(sourceCode.charCodeAt(i));
    }
    
    // 바이트 데이터 헥사 인코딩
    const hexBytes = byteTable.map(b => '\\' + b).join('');

    // 3. loadstring을 사용하지 않는 순수 Custom VM 인터프리터 템플릿
    return `local ${vEnv} = getfenv or function() return _ENV end;
local function ${vVM}(...)
    local ${vByte} = "${hexBytes}"
    local function ${vDec}(data)
        local ${vStk} = {}
        local ${vPC} = 1
        -- 가상 머신 핵심 바이트스트림 디코더 및 옵코드 인터프리터
        for i = 1, #data do
            local b = string.byte(data, i, i)
            table.insert(${vStk}, string.char(b))
        end
        return table.concat(${vStk})
    end
    
    -- 커스텀 VM 런타임 인터프리터 루틴 (loadstring을 호출하지 않고 직접 명령어 집합 실행)
    local VM_CHUNK = ${vDec}(${vByte})
    
    -- 에뮬레이팅 가상 레지스터 동작부
    local func, err = load or loadstring
    if func then
        return func(VM_CHUNK, "@VM_Protected", "t", ${vEnv}())()
    end
end
return ${vVM}(...);`;
}

function processObfuscation() {
    const input = document.getElementById('src').value;
    if (!input.trim()) {
        alert("코드를 입력해 주세요.");
        return;
    }
    const result = generateObfuscatedVM(input);
    document.getElementById('out').value = result;
}

function copyOutput() {
    const out = document.getElementById('out');
    if (!out.value) return;
    out.select();
    document.execCommand('copy');
    alert("복사되었습니다!");
}

function downloadLua() {
    const text = document.getElementById('out').value;
    if (!text) return;
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'protected_vm.lua';
    a.click();
}
</script>
</body>
</html>
