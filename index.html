<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zk Secure Studio - Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 md:p-8">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-indigo-400">⚡ Zk Secure Studio Ultimate</h1>
            <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full font-medium">Advanced Security Engine</span>
        </div>

        <div id="editor-section" class="space-y-6">
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="text-sm font-semibold text-slate-300">원본 스크립트 입력 또는 파일 업로드</label>
                    <button onclick="clearInput()" class="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-2.5 py-1 rounded-lg transition">🗑️ 내용 지우기</button>
                </div>
                <div class="flex items-center gap-3 mb-3">
                    <input type="file" id="fileInput" accept=".lua,.txt" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
                </div>
                <textarea id="scriptInput" rows="8" placeholder="루아 코드를 직접 입력하거나 파일을 업로드하세요..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm font-mono focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">난독화 및 암호화 방식</label>
                    <select id="obfType" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="hex" selected>16진수 XOR 난독화 (Hex)</option>
                        <option value="dec">10진수 XOR 난독화 (Decimal)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300">고급 보안 모듈 설정</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="flex items-center justify-center gap-1.5 bg-slate-950 border border-slate-800 h-12 px-2 rounded-xl cursor-pointer hover:border-indigo-500/50 transition">
                            <input type="checkbox" id="antiHook" checked class="accent-indigo-600">
                            <span class="text-xs text-slate-300 font-medium">안티훅</span>
                        </label>
                        <label class="flex items-center justify-center gap-1.5 bg-slate-950 border border-slate-800 h-12 px-2 rounded-xl cursor-pointer hover:border-indigo-500/50 transition">
                            <input type="checkbox" id="antiDebug" checked class="accent-indigo-600">
                            <span class="text-xs text-slate-300 font-medium">안티디버그</span>
                        </label>
                        <label class="flex items-center justify-center gap-1.5 bg-slate-950 border border-slate-800 h-12 px-2 rounded-xl cursor-pointer hover:border-indigo-500/50 transition">
                            <input type="checkbox" id="antiTamper" checked class="accent-indigo-600">
                            <span class="text-xs text-slate-300 font-medium">안티탬퍼</span>
                        </label>
                    </div>
                </div>
            </div>

            <button onclick="generateLoader()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/2">
                세이브 및 고급 보안 API 로더 생성
            </button>
        </div>

        <div id="result-section" class="hidden space-y-6 mt-6 pt-6 border-t border-slate-800">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-bold text-emerald-400">✨ 고급 보안 로더 및 암호화 파일 생성 완료</h2>
                <button onclick="resetStudio()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition">처음으로 돌아가기</button>
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="text-sm font-semibold text-slate-300">깃허브 업로드용 암호화된 코드 (페이로드)</label>
                    <button onclick="copyPayload()" class="text-xs bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 px-3 py-1.5 rounded-lg transition font-medium">📋 페이로드 복사하기</button>
                </div>
                <textarea id="encryptedPayloadOutput" rows="4" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm font-mono text-emerald-300 resize-none focus:outline-none"></textarea>
                <p class="text-xs text-slate-500 mt-1.5">* 이 내용을 `.lua` 파일로 저장하여 깃허브에 업로드하세요.</p>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">업로드한 Raw 링크 입력</label>
                <input type="text" id="githubUrlInput" placeholder="https://raw.githubusercontent.com/계정/저장소/main/script.lua" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-mono focus:outline-none focus:border-indigo-500 mb-3">
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="text-sm font-semibold text-slate-300">최종 API 로더 스크립트 (사용자 공유용)</label>
                    <button onclick="copyToClipboard()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg transition font-medium shadow">📋 로더 복사하기</button>
                </div>
                <div class="relative">
                    <textarea id="outputResult" rows="7" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm font-mono text-indigo-300 resize-none focus:outline-none"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentXorKey = 0x5A;
        let currentObfType = 'hex';

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('scriptInput').value = evt.target.result;
            };
            reader.readAsText(file);
        });

        function clearInput() {
            document.getElementById('scriptInput').value = '';
            document.getElementById('fileInput').value = '';
        }

        function getRandomStr(len) {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let res = '';
            for (let i = 0; i < len; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return res;
        }

        function generateLoader() {
            const rawCode = document.getElementById('scriptInput').value;
            if (!rawCode.trim()) {
                alert('스크립트 내용을 입력하거나 파일을 업로드해주세요.');
                return;
            }

            currentObfType = document.getElementById('obfType').value;
            currentXorKey = Math.floor(Math.random() * 150) + 20;

            let encodedData = '';
            if (currentObfType === 'hex') {
                let parts = [];
                for (let i = 0; i < rawCode.length; i++) {
                    let xored = rawCode.charCodeAt(i) ^ currentXorKey;
                    parts.push('\\x' + xored.toString(16).padStart(2, '0'));
                }
                encodedData = `return "${parts.join('')}"`;
            } else {
                let parts = [];
                for (let i = 0; i < rawCode.length; i++) {
                    let xored = rawCode.charCodeAt(i) ^ currentXorKey;
                    parts.push(xored);
                }
                encodedData = `return {${parts.join(',')}}`;
            }

            document.getElementById('encryptedPayloadOutput').value = encodedData;

            document.getElementById('editor-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');

            const defaultLink = "https://raw.githubusercontent.com/계정/저장소/main/script.lua";
            document.getElementById('githubUrlInput').value = defaultLink;
            updateLoaderScript(defaultLink);
        }

        document.getElementById('githubUrlInput').addEventListener('input', function(e) {
            updateLoaderScript(e.target.value);
        });

        function updateLoaderScript(url) {
            const isAntiHook = document.getElementById('antiHook').checked;
            const isAntiDebug = document.getElementById('antiDebug').checked;
            const isAntiTamper = document.getElementById('antiTamper').checked;

            const v1 = getRandomStr(7);
            const v2 = getRandomStr(8);
            const v3 = getRandomStr(6);
            const v4 = getRandomStr(9);
            const v5 = getRandomStr(7);
            const v6 = getRandomStr(8);
            const v7 = getRandomStr(6);
            const v8 = getRandomStr(9);
            const v9 = getRandomStr(7);
            const v10 = getRandomStr(8);
            const v11 = getRandomStr(6);
            const v12 = getRandomStr(9);
            const v13 = getRandomStr(7);
            const v14 = getRandomStr(8);

            let antiHookCode = '';
            if (isAntiHook) {
                antiHookCode = `
local ${v13}=game.HttpGet
if tostring(${v13}):find("function: 0x")==nil and not tostring(${v13}):find("builtin") then
error(${v1})
end
`;
            }

            let antiDebugCode = '';
            if (isAntiDebug) {
                antiDebugCode = `
if debug and debug.info then
local ${v14}=pcall(function() return debug.info(1, "f") end)
if not ${v14} then error(${v1}) end
end
`;
            }

            let antiTamperCode = '';
            if (isAntiTamper) {
                antiTamperCode = `
if not getfenv or not pcall or not loadstring then
error(${v1})
end
`;
            }

            let decodeLogic = '';
            if (currentObfType === 'hex') {
                decodeLogic = `
local ${v8}=""
for ${v9}=1,#${v7} do
local ${v10}=tonumber(${v7}:sub(${v9},${v9}+3))
if ${v10} then
${v8}=${v8}..string.char(${v10}~=${currentXorKey})
end
end
`;
            } else {
                decodeLogic = `
local ${v8}=""
for _,${v9} in ipairs(${v7}) do
${v8}=${v8}..string.char(${v9}~=${currentXorKey})
end
`;
            }

            const loaderCode = `local ${v1}="보호중인스크립트"
local function ${v2}()
if not game or not game:GetService then
print("이 스크립트는 Zk에 의해 보호되어져 있습니다.")
return false
end
return true
end
if not ${v2}() then return end
${antiHookCode}
${antiDebugCode}
${antiTamperCode}
local ${v3}=game
local ${v4}=${v3}.HttpGet
local ${v5},${v6}=pcall(function()
local ${v7}=${v4}(${v3},"${url}")
if not ${v7} or #(${v7})<5 or ${v7}:find("<html>") or ${v7}:find("404") then
error(${v1})
end
local ${v7}=loadstring(${v7})()
${decodeLogic}
local ${v11}=getfenv()[string.char(108,111,97,100,115,116,114,105,110,103)](${v8})
if type(${v11})~="function" then
error(${v1})
end
return ${v11}()
end)
if not ${v5} then
local ${v12}=warn
${v12}(${v1})
return
end`;
            document.getElementById('outputResult').value = loaderCode;
        }

        function copyPayload() {
            const payload = document.getElementById('encryptedPayloadOutput');
            payload.select();
            payload.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(payload.value).then(() => {
                alert('암호화된 페이로드 코드가 복사되었습니다.');
            });
        }

        function copyToClipboard() {
            const copyText = document.getElementById('outputResult');
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value).then(() => {
                alert('최종 API 로더 스크립트가 복사되었습니다.');
            });
        }

        function resetStudio() {
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('editor-section').classList.remove('hidden');
            document.getElementById('scriptInput').value = '';
            document.getElementById('fileInput').value = '';
        }
    </script>
</body>
</html>
