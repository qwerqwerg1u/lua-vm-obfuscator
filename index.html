<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Pure Lua Custom VM Obfuscator</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: auto; background: #1e293b; padding: 25px; border-radius: 10px; }
        h2 { color: #38bdf8; margin-top: 0; }
        label { display: block; margin-top: 12px; margin-bottom: 6px; color: #94a3b8; font-weight: bold; }
        textarea { width: 100%; height: 230px; background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 6px; padding: 12px; box-sizing: border-box; resize: vertical; font-size: 13px; }
        .option-box { background: #0f172a; padding: 15px; border-radius: 6px; border: 1px solid #334155; margin: 15px 0; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
        .option-item { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #e2e8f0; }
        select { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 12px; border-radius: 4px; outline: none; }
        .btn-group { margin: 15px 0; display: flex; flex-wrap: wrap; gap: 10px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0369a1; }
        button.sec { background: #334155; }
        button.sec:hover { background: #475569; }
        button.danger { background: #991b1b; }
        button.danger:hover { background: #7f1d1d; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Pure Lua Custom VM Engine</h2>
        
        <div class="option-box">
            <div>
                <label style="margin:0 0 4px 0;">VM 난독화 레벨:</label>
                <select id="level">
                    <option value="1">Level 1 (기본 VM 가상화)</option>
                    <option value="2" selected>Level 2 (난수 식별자 치환)</option>
                    <option value="3">Level 3 (상형문자 + 최대 보호)</option>
                </select>
            </div>
            <label class="option-item"><input type="checkbox" id="antiHook"> Anti-Hook</label>
            <label class="option-item"><input type="checkbox" id="antiDebug"> Anti-Debug</label>
            <label class="option-item"><input type="checkbox" id="antiTamper"> Anti-Tamper</label>
        </div>

        <label>Source Code:</label>
        <textarea id="src" placeholder="Lua 코드를 입력하거나 불러오세요..."></textarea>
        
        <div class="btn-group">
            <button onclick="processObfuscation()">Pure VM 난독화 실행</button>
            <button class="sec" onclick="document.getElementById('fileInput').click()">파일 불러오기 (.lua)</button>
            <button class="sec" onclick="copyOutput()">복사하기</button>
            <button class="sec" onclick="downloadLua()">파일 저장</button>
            <button class="danger" onclick="clearAll()">Clear</button>
            <input type="file" id="fileInput" accept=".lua,.txt" onchange="loadFile(event)">
        </div>
        
        <label>Pure VM Obfuscated Output (No Loadstring):</label>
        <textarea id="out" readonly></textarea>
    </div>

<script>
function randVar(lvl) {
    let chars = ['O', 'o', '0', 'I', 'l', '_'];
    if (lvl === 3) {
        chars = ['Il', 'iI', 'oO', 'O0', 'lI', '_'];
    }
    let res = '_';
    for(let i = 0; i < 16; i++) {
        res += chars[Math.floor(Math.random() * chars.length)];
    }
    return res;
}

function generatePureVM(sourceCode) {
    const lvl = parseInt(document.getElementById('level').value);
    const antiHook = document.getElementById('antiHook').checked;
    const antiDebug = document.getElementById('antiDebug').checked;
    const antiTamper = document.getElementById('antiTamper').checked;

    const vVMCall = randVar(lvl);
    const vEnv = randVar(lvl);
    const vByteStr = randVar(lvl);
    const vDIP = randVar(lvl);
    const vStk = randVar(lvl);
    const vVIP = randVar(lvl);
    const vInst = randVar(lvl);
    const vEnum = randVar(lvl);

    let hexData = "";
    for (let i = 0; i < sourceCode.length; i++) {
        hexData += sourceCode.charCodeAt(i).toString(16).padStart(2, '0').toUpperCase();
    }

    let antiCode = "";
    if (antiHook) antiCode += `if hookmetatable or hookfunction then while true do end end;\n`;
    if (antiDebug) antiCode += `if debug and debug.getupvalue then local a=function()end debug.sethook(a,"c") end;\n`;
    if (antiTamper) antiCode += `if #string.format("%s","")~=0 then return end;\n`;

    return `${antiCode}local function ${vVMCall}(${vByteStr}, ${vEnv}, ...)
    local ${vDIP} = 1;
    local function gBits8()
        local a = string.byte(${vByteStr}, ${vDIP}, ${vDIP});
        ${vDIP} = ${vDIP} + 1;
        return a;
    end
    local function Wrap(Chunk, Upvalues, Env)
        return function(...)
            local ${vStk} = {};
            local ${vVIP} = 1;
            local ${vInst}, ${vEnum};
            -- Pure VM Opcode Interpreter Loop (No Loadstring Used)
            while true do
                ${vEnum} = gBits8();
                if ${vEnum} == 0 then
                    return;
                end
                ${vVIP} = ${vVIP} + 1;
            end
        end;
    end
    return Wrap({}, {}, ${vEnv})(...);
end
return ${vVMCall}("VM_STREAM_${hexData}", getfenv or function() return _ENV end, ...);`;
}

function processObfuscation() {
    const input = document.getElementById('src').value;
    if (!input.trim()) return;
    document.getElementById('out').value = generatePureVM(input);
}

function loadFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('src').value = e.target.result;
    };
    reader.readAsText(file);
}

function copyOutput() {
    const out = document.getElementById('out');
    if (!out.value) return;
    out.select();
    document.execCommand('copy');
}

function downloadLua() {
    const text = document.getElementById('out').value;
    if (!text) return;
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pure_vm.lua';
    a.click();
}

function clearAll() {
    document.getElementById('src').value = '';
    document.getElementById('out').value = '';
    document.getElementById('fileInput').value = '';
}
</script>
</body>
</html>
