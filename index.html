<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Advanced Lua VM Obfuscator</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: auto; background: #1e293b; padding: 25px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-top: 0; }
        label { display: block; margin-top: 12px; margin-bottom: 6px; color: #94a3b8; font-weight: bold; }
        textarea { width: 100%; height: 250px; background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 6px; padding: 12px; box-sizing: border-box; resize: vertical; font-size: 13px; }
        .option-box { background: #0f172a; padding: 15px; border-radius: 6px; border: 1px solid #334155; margin: 15px 0; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
        .option-item { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #e2e8f0; }
        select { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 12px; border-radius: 4px; outline: none; }
        .btn-group { margin: 15px 0; display: flex; flex-wrap: wrap; gap: 10px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        button.sec { background: #334155; }
        button.sec:hover { background: #475569; }
        button.danger { background: #991b1b; }
        button.danger:hover { background: #7f1d1d; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Advanced Lua VM Obfuscator Studio</h2>
        
        <div class="option-box">
            <div>
                <label style="margin:0 0 4px 0;">난독화 레벨:</label>
                <select id="level">
                    <option value="1">Level 1 (기본 가상화)</option>
                    <option value="2" selected>Level 2 (XOR 다중 인코딩)</option>
                    <option value="3">Level 3 (최대 난독화 + 더미 인스트럭션)</option>
                </select>
            </div>
            <label class="option-item"><input type="checkbox" id="antiHook"> Anti-Hook</label>
            <label class="option-item"><input type="checkbox" id="antiDebug"> Anti-Debug</label>
            <label class="option-item"><input type="checkbox" id="antiTamper"> Anti-Tamper</label>
        </div>

        <label>Input Source Code:</label>
        <textarea id="src" placeholder="Lua 코드를 입력하거나 파일을 업로드하세요..."></textarea>
        
        <div class="btn-group">
            <button onclick="processObfuscation()">난독화 실행</button>
            <button class="sec" onclick="document.getElementById('fileInput').click()">파일 불러오기 (.lua)</button>
            <button class="sec" onclick="copyOutput()">복사하기</button>
            <button class="sec" onclick="downloadLua()">파일 저장</button>
            <button class="danger" onclick="clearAll()">Clear</button>
            <input type="file" id="fileInput" accept=".lua,.txt" onchange="loadFile(event)">
        </div>
        
        <label>Obfuscated Result:</label>
        <textarea id="out" readonly placeholder="결과가 여기에 표시됩니다..."></textarea>
    </div>

<script>
function randVar() {
    const chars = ['O', 'o', '0', 'I', 'l', '_'];
    let res = '_';
    for(let i = 0; i < 16; i++) {
        res += chars[Math.floor(Math.random() * chars.length)];
    }
    return res;
}

function generateObfuscatedVM(sourceCode) {
    const level = parseInt(document.getElementById('level').value);
    const antiHook = document.getElementById('antiHook').checked;
    const antiDebug = document.getElementById('antiDebug').checked;
    const antiTamper = document.getElementById('antiTamper').checked;

    const key1 = Math.floor(Math.random() * 150) + 20;
    const key2 = Math.floor(Math.random() * 100) + 10;

    let bytes = [];
    for (let i = 0; i < sourceCode.length; i++) {
        let b = sourceCode.charCodeAt(i);
        if (level >= 2) b = b ^ key1;
        if (level === 3) b = (b + key2) % 256;
        bytes.push(b);
    }
    const byteString = bytes.map(b => '\\' + b).join('');

    const vEnv = randVar();
    const vKey1 = randVar();
    const vKey2 = randVar();
    const vStr = randVar();
    const vRes = randVar();
    const vByte = randVar();
    const vFn = randVar();

    let protectionCode = "";

    if (antiHook) {
        protectionCode += `if hookmetatable or hookfunction or getrawmetatable then local a=function() while true do end end pcall(function() hookfunction(print,a) end) end;\n`;
    }
    if (antiDebug) {
        protectionCode += `if debug and (debug.getupvalue or debug.setupvalue) then local b=function() end debug.sethook(b,"c") end;\n`;
    }
    if (antiTamper) {
        protectionCode += `if #string.format("%s","")~=0 then return end;\n`;
    }

    return `${protectionCode}local ${vEnv} = getfenv or function() return _ENV end;
local ${vKey1} = ${key1};
local ${vKey2} = ${key2};
local ${vStr} = "${byteString}";
local ${vRes} = {};
for i = 1, #${vStr} do
    local ${vByte} = string.byte(${vStr}, i, i);
    ${level === 3 ? `${vByte} = (${vByte} - ${vKey2}) % 256;` : ''}
    ${level >= 2 ? `${vByte} = bit32 and bit32.bxor(${vByte}, ${vKey1}) or (${vByte} >= ${vKey1} and ${vByte} - ${vKey1} or ${vByte} + ${vKey1});` : ''}
    table.insert(${vRes}, string.char(${vByte}));
end;
local ${vFn} = load or loadstring;
if ${vFn} then
    return ${vFn}(table.concat(${vRes}), "@Protected", "t", ${vEnv}())();
end;`;
}

function processObfuscation() {
    const input = document.getElementById('src').value;
    if (!input.trim()) return;
    document.getElementById('out').value = generateObfuscatedVM(input);
}

function loadFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('src').value = e.target.result;
    };
    reader.readAsText(file);
}

function copyOutput() {
    const out = document.getElementById('out');
    if (!out.value) return;
    out.select();
    document.execCommand('copy');
}

function downloadLua() {
    const text = document.getElementById('out').value;
    if (!text) return;
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'obfuscated.lua';
    a.click();
}

function clearAll() {
    document.getElementById('src').value = '';
    document.getElementById('out').value = '';
    document.getElementById('fileInput').value = '';
}
</script>
</body>
</html>
