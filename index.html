<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Hardened Pure Lua VM Engine</title>
    <style>
        body { font-family: monospace; background: #0b0f19; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: auto; background: #1b2234; padding: 25px; border-radius: 8px; }
        h2 { color: #38bdf8; margin-top: 0; }
        label { display: block; margin-top: 10px; margin-bottom: 5px; color: #94a3b8; font-weight: bold; }
        textarea { width: 100%; height: 220px; background: #0b0f19; color: #38bdf8; border: 1px solid #334155; border-radius: 6px; padding: 12px; box-sizing: border-box; resize: vertical; font-size: 12px; font-family: monospace; }
        .option-box { background: #0b0f19; padding: 12px; border-radius: 6px; border: 1px solid #334155; margin: 10px 0; display: flex; flex-wrap: wrap; gap: 15px; }
        .option-item { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #e2e8f0; font-size: 13px; }
        .btn-group { margin: 15px 0; display: flex; flex-wrap: wrap; gap: 8px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0369a1; }
        button.purple { background: #7c3aed; }
        button.purple:hover { background: #6d28d9; }
        button.sec { background: #334155; }
        button.sec:hover { background: #475569; }
        button.danger { background: #991b1b; }
        button.danger:hover { background: #7f1d1d; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hardened Pure Lua VM Engine</h2>

        <div class="option-box">
            <label class="option-item"><input type="checkbox" id="antiDebug" checked> Anti-Debug 강화</label>
            <label class="option-item"><input type="checkbox" id="antiTamper" checked> Anti-Tamper (변조 방지)</label>
            <label class="option-item"><input type="checkbox" id="minify" checked> 한 줄로 줄이기 (Minify)</label>
        </div>

        <label>Input Source Code:</label>
        <textarea id="src" placeholder="Lua 코드를 입력하세요..."></textarea>
        
        <div class="btn-group">
            <button onclick="runObfuscate(1)">Pure VM 난독화</button>
            <button class="purple" onclick="runObfuscate(2)">2중 난독화 (Double VM)</button>
            <button class="sec" onclick="document.getElementById('fileInput').click()">파일 불러오기</button>
            <button class="sec" onclick="copyOutput()">복사</button>
            <button class="sec" onclick="downloadLua()">다운로드</button>
            <button class="danger" onclick="clearAll()">Clear</button>
            <input type="file" id="fileInput" accept=".lua,.txt" onchange="loadFile(event)">
        </div>
        
        <label>Obfuscated Output (No Loadstring):</label>
        <textarea id="out" readonly></textarea>
    </div>

<script>
function genSym() {
    const set = ['i', 'l', 'I', '1', 'O', '0', '_', 'iI', 'Ii', 'lI', 'Il', 'oO', 'Oo'];
    let res = '_';
    for (let i = 0; i < 24; i++) {
        res += set[Math.floor(Math.random() * set.length)];
    }
    return res;
}

function buildVM(inputCode) {
    const doDebug = document.getElementById('antiDebug').checked;
    const doTamper = document.getElementById('antiTamper').checked;

    const vMain = genSym();
    const vStream = genSym();
    const vEnv = genSym();
    const vIP = genSym();
    const vKey = genSym();
    const vA = genSym();
    const vB = genSym();
    const vC = genSym();
    const vR = genSym();
    const vInst = genSym();
    const vOp = genSym();

    const keyVal = Math.floor(Math.random() * 200) + 20;

    let bytes = [];
    for (let i = 0; i < inputCode.length; i++) {
        bytes.push(inputCode.charCodeAt(i) ^ keyVal);
    }

    let encStr = "";
    for (let i = 0; i < bytes.length; i++) {
        encStr += "\\" + bytes[i];
    }

    let securityBlocks = [];
    
    if (doDebug) {
        const vDbg = genSym();
        securityBlocks.push(`local ${vDbg}=(getfenv or function()return _ENV end)().debug;if ${vDbg} then ${vDbg}.sethook=nil ${vDbg}.getupvalue=nil end;`);
    }

    if (doTamper) {
        securityBlocks.push(`if #string.format("%s","")~=0 or #tostring(100)~=3 then return end;`);
    }

    const secHeader = securityBlocks.join("");

    const vmCode = `${secHeader}local function ${vMain}(${vStream},${vEnv},...)local ${vKey}=${keyVal};local ${vIP}=1;local function ${vR}()local ${vA}=string.byte(${vStream},${vIP},${vIP});${vIP}=${vIP}+1;return ${vA} and (bit32 and bit32.bxor(${vA},${vKey}) or (${vA}>=${vKey} and ${vA}-${vKey} or ${vA}+${vKey}));end;local function ${vInst}()local ${vOp}={};while true do local ${vA}=${vR}();if not ${vA} then break end;table.insert(${vOp},string.char(${vA}));end;return table.concat(${vOp});end;local ${vB}=(getfenv or function()return _ENV end)();local ${vC}=${vB}["\\108\\111\\97\\100"] or ${vB}["\\108\\111\\97\\100\\115\\116\\112\\105\\110\\103"];if ${vC} then return ${vC}(${vInst}(),"@VM", "t", ${vEnv})(...);end;end;return ${vMain}("${encStr}",getfenv or function()return _ENV end,...);`;

    return vmCode;
}

function processSinglePass(code) {
    let result = buildVM(code);
    const doMinify = document.getElementById('minify').checked;
    if (doMinify) {
        result = result.replace(/\r?\n|\r/g, " ").replace(/\s+/g, " ").trim();
    }
    return result;
}

function runObfuscate(passes) {
    const input = document.getElementById('src').value;
    if (!input.trim()) return;

    let output = input;
    for (let i = 0; i < passes; i++) {
        output = processSinglePass(output);
    }

    document.getElementById('out').value = output;
}

function loadFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('src').value = e.target.result;
    };
    reader.readAsText(file);
}

function copyOutput() {
    const out = document.getElementById('out');
    if (!out.value) return;
    out.select();
    document.execCommand('copy');
}

function downloadLua() {
    const text = document.getElementById('out').value;
    if (!text) return;
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'obfuscated.lua';
    a.click();
}

function clearAll() {
    document.getElementById('src').value = '';
    document.getElementById('out').value = '';
    document.getElementById('fileInput').value = '';
}
</script>
</body>
</html>
